name: Generate provider network data

on:
  push:
    branches:
      - main
    paths:
      - Directory/OccuMed_Anonymized_NonExpired_Clinic_Directory.xlsx
      - scripts/generate_provider_network_points.py
      - .github/workflows/generate-provider-network-data.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Generate anonymized coordinate dataset
        run: python scripts/generate_provider_network_points.py

      - name: Verify generated dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('public/data/provider-network-points.json')
          data = json.loads(path.read_text())
          valid = data.get('validCoordinates', 0)
          invalid = data.get('invalidCoordinates', 0)
          points = data.get('points', [])
          if valid != len(points):
              raise SystemExit(f'validCoordinates={valid} but points={len(points)}')
          if valid < 1000:
              raise SystemExit(f'Implausibly low coordinate count: {valid}')
          print(f'Verified {valid:,} valid coordinates and {invalid:,} invalid rows.')
          PY

      - name: Commit generated data
        run: |
          if [ -z "$(git status --porcelain -- public/data/provider-network-points.json)" ]; then
            echo 'Provider network dataset is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/provider-network-points.json
          git commit -m 'Generate anonymized provider network coordinate data'
          git push origin HEAD:main
