name: Archive Lusion reference assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/archive_lusion_browser.mjs
      - .github/workflows/archive-lusion-reference.yml

permissions:
  contents: write

concurrency:
  group: archive-lusion-reference
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture browser-verified Lusion resources
        run: node scripts/archive_lusion_browser.mjs

      - name: Validate archive is real
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/research/lusion-reference/raw-site/archive-manifest.json
          test -s docs/research/lusion-reference/raw-site/resource-urls.txt
          test -d docs/research/lusion-reference/raw-site/network
          COUNT=$(find docs/research/lusion-reference/raw-site/network -type f | wc -l | tr -d ' ')
          echo "Captured network files: $COUNT"
          test "$COUNT" -gt 20
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('docs/research/lusion-reference/raw-site/archive-manifest.json','utf8'));
          if (!m.resourceCount || m.resourceCount < 20) throw new Error(`Too few resources: ${m.resourceCount}`);
          const fallbackSizes = new Map();
          for (const r of m.resources) fallbackSizes.set(r.sha256, (fallbackSizes.get(r.sha256)||0)+1);
          const maxDup = Math.max(...fallbackSizes.values());
          console.log('Resource count:', m.resourceCount, 'Max duplicate hash count:', maxDup);
          if (maxDup > Math.max(25, Math.floor(m.resourceCount * 0.20))) {
            throw new Error(`Archive appears contaminated by repeated fallback responses: ${maxDup}/${m.resourceCount}`);
          }
          console.log('Known asset validation:', m.knownAssetValidation);
          NODE

      - name: Record verified archive in repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/research/lusion-reference/raw-site

          if git diff --cached --quiet; then
            echo 'Verified archive produced no repository changes.'
            exit 0
          fi

          git commit -m 'Replace Lusion archive with browser-verified capture'
          git push origin HEAD:main
