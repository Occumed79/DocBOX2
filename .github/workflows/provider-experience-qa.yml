name: Provider experience QA

on:
  push:
    branches:
      - main
    paths:
      - app/experience/**
      - app/api/provider-resources/**
      - components/experience/**
      - public/data/provider-network-points.json
      - tests/e2e/provider-experience.spec.ts
      - package.json
      - package-lock.json
      - .github/workflows/provider-experience-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build
