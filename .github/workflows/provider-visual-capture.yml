name: Provider visual capture

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-visual-capture.yml'
      - 'scripts/capture_provider_experience.mjs'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Capture rendered experience
        run: |
          npm start > /tmp/docbox-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3000/experience >/dev/null; then
              break
            fi
            sleep 2
          done
          node scripts/capture_provider_experience.mjs

      - name: Upload visual captures
        uses: actions/upload-artifact@v4
        with:
          name: provider-visual-captures
          path: visual-captures/*.png
          if-no-files-found: error
          retention-days: 3
